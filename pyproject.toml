[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "voxy"
version = "0.0.3"
description = "Facade for voice cloning and speech synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "audio",
    "speech",
    "speech-synthesis",
    "text-to-speech",
    "tts",
    "voice-cloning",
    "csm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Thor Whalen" },
]
# These are all imported at module level by voxy.base, so `import voxy` fails
# without them. (setup.cfg declared no install_requires at all, which made
# `pip install voxy` produce an unimportable package.)
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "huggingface-hub",
]

[project.urls]
Homepage = "https://github.com/thorwhalen/voxy"
Repository = "https://github.com/thorwhalen/voxy"
Documentation = "https://thorwhalen.github.io/voxy"
Issues = "https://github.com/thorwhalen/voxy/issues"

[project.optional-dependencies]
# `voxy.base` imports whisper behind a try/except; installing this extra
# enables the automatic-transcription features (audio_to_text, and voice
# cloning without an explicit transcript).
transcription = [
    "openai-whisper",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
# wads CI runs `pytest --doctest-modules` with NO path argument, so collection
# is driven entirely by testpaths. There is no top-level tests/ dir here, so
# point it at the package so the package's own (doc)tests actually run.
testpaths = [
    "voxy",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "voxy"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
    "docsrc",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
